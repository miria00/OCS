[project]
name = "ocsolver"
dynamic = ["version"]
description = "Operator-native convex solver for large-scale optimization on GPUs"
authors = [{ name = "Miria Feng" }, { name = "Stephen Boyd" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax==0.11.1",
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
transport = ["jax==0.11.1", "cupy-cuda12x==13.6.0"]
validation = ["cvxpy>=1.6", "scs", "clarabel", "scipy>=1.10"]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "cvxpy>=1.6",
    "scs",
    "clarabel",
    "scipy>=1.10",
    "POT>=0.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "ocs.__version__" }

[tool.setuptools.packages.find]
include = ["ocs*"]
