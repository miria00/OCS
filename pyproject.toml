[project]
name = "ocs"
version = "0.1.0"
description = "Operator-native convex solver for large-scale optimization on GPUs"
authors = [{ name = "Miria Feng" }, { name = "Stephen Boyd" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/cvxgrp/ocs"

[project.optional-dependencies]
validation = ["cvxpy>=1.4", "scs", "clarabel", "scipy>=1.10"]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "cvxpy>=1.4",
    "scs",
    "clarabel",
    "scipy>=1.10",
    "POT>=0.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocs*"]
